services:
  ui:
    build: .
    ports: ["8501:8501"]
    env_file: .env
    volumes: ["talkai_data:/app/chroma_db"]
  api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    env_file: .env
    volumes: ["talkai_data:/app/chroma_db"]
volumes:
  talkai_data:
